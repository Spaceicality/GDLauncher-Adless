name: Build GDLauncher No Ads

on:
  push:
    branches:
      - main
      - carbon
    tags:
      - "v*"

  pull_request:
    branches:
      - main
      - carbon

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build application
        run: |
          python build.py

      - name: Verify application
        run: |
          test -d "dist/GDLauncher No Ads.app"
          test -f "dist/GDLauncher No Ads.app/Contents/Info.plist"
          test -x "dist/GDLauncher No Ads.app/Contents/MacOS/GDLauncher-No-Ads"
          test -x "dist/GDLauncher No Ads.app/Contents/MacOS/gdlauncher-no-ads-injector"
          test -f "dist/GDLauncher No Ads.app/Contents/Resources/GDLauncher.icns"

      - name: Test bundled injector
        run: |
          "dist/GDLauncher No Ads.app/Contents/MacOS/gdlauncher-no-ads-injector" --help

      - name: Create DMG
        run: |
          mkdir -p dmg-root

          cp -R \
            "dist/GDLauncher No Ads.app" \
            "dmg-root/GDLauncher No Ads.app"

          ln -s /Applications "dmg-root/Applications"

          hdiutil create \
            -volname "GDLauncher No Ads" \
            -srcfolder "dmg-root" \
            -ov \
            -format UDZO \
            "dist/GDLauncher-No-Ads-macOS.dmg"

      - name: Verify DMG
        run: |
          test -f "dist/GDLauncher-No-Ads-macOS.dmg"

          hdiutil imageinfo \
            "dist/GDLauncher-No-Ads-macOS.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: GDLauncher-No-Ads-macOS
          path: "dist/GDLauncher-No-Ads-macOS.dmg"
          if-no-files-found: error

      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/GDLauncher-No-Ads-macOS.dmg